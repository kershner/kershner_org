<div class="menu-container">
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-controls">
    <span class="title">Daggerwalk</span>
    <div class="menu-icon">☰</div>
  </button>

  <div class="site-menu">
    <div id="site-controls" class="site-controls hidden">
      <div class="site-control-row site-control-links">
        <a href="{% url 'daggerwalk_guild_hall' %}">Guild Hall</a>
        <a href="{% url 'daggerwalk_monuments' %}">Monuments</a>
      </div>
      <div class="site-control-row">
        <div class="site-control-checkbox">
          <input type="radio" id="light" name="background" value="light" checked>
          <label for="light">Light</label>
        </div>
        <div class="site-control-checkbox">
          <input type="radio" id="dark" name="background" value="dark">
          <label for="dark">Dark</label>
        </div>
      </div>

      <div class="site-control-row">
        <div class="site-control-input">
          <label for="accentColor">Accent</label>
          <input id="accentColor" type="color" name="accent-color">
        </div>
      </div>

      <div class="site-control-row">
        <button class="reset-default-button" type="button">Reset colors</button>
      </div>

      {% if show_chat_toggle %}
        <div class="site-control-row">
          <button id="toggle-chat" type="button" aria-pressed="false">Hide Chat</button>
        </div>
      {% endif %}
    </div>
  </div>
</div>
