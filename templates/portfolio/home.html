{% extends 'portfolio/base.html' %}
{% load kershner_tags %}

{% block content %}
<div class="welcome-wrapper">
    <!-- Big Text Blurbs -->
    <section class="welcome">
        <h1>
            <a href="https://www.github.com/kershner" target="_blank" class="color-wave big-name" title="Tyler Kershner's Github" aria-label="Tyler Kershner"><span aria-hidden="true">{% for letter in "Tyler Kershner" %}<span class="welcome-letter" style="--letter: {{ forloop.counter0 }}">{{ letter }}</span>{% endfor %}</span></a>
        </h1>

        <h2 class="accent-font">
            Full stack software engineer
        </h2>
    </section>
</div>

<!-- Projects -->
<a id="projects-wrapper-anchor"></a>
{% include "portfolio/includes/nav.html" %}
<div class="projects-wrapper"></div>

<!-- More Projects Btn -->
<div class="more-projects-btn-wrapper" title="More projects">
    <div id="more-projects-btn" class="generic-btn dynamic-color hidden">More</div>
</div>
{% endblock %}

{% block extra_javascripts %}
    <script type="text/javascript">
        window.addEventListener('portfolioReady', () => {
            portfolio.projectsPerPage = {{ projects_per_page }};
            portfolio.projectsHtml = {{ projects_html|safe }};
            portfolio.filteredProjects = portfolio.projectsHtml;

            portfolio.scrollEvents();
            portfolio.projectFilter();
            portfolio.searchSuggestions();

            portfolio.stickyNav.querySelector('.sticky-nav-title').addEventListener('click', () => {
                window.scrollTo(0, 0);
            });
        });
    </script>
{% endblock %}
